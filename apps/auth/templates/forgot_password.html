{% extends "base.html" %}
{% block title %}RAIDsystem — Forgot password{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Reset your password</h2>
    <p class="auth-hint">Enter your email address and we'll send you a code to reset your password.</p>
    <form method="post" class="auth-form">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@nlife.in" required autofocus>
        <button type="submit" class="auth-submit">Send reset code</button>
    </form>
    <p class="auth-footer">
        <a href="{{ url_for('auth.login') }}" class="link-button">Back to sign in</a>
    </p>
</div>
{% endblock %}
