{% extends "base.html" %}
{% block title %}RAIDsystem — Get Started{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Get Started</h2>
    <p class="auth-hint">Enter your email and password. New to RAIDsystem or no password set yet? Leave the password blank to set one via email code.</p>
    <form method="post" class="auth-form">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@nlife.in" value="{{ email or '' }}" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password (leave blank if you don't have one)">

        <button type="submit" class="auth-submit">Get Started</button>
    </form>
</div>
{% endblock %}
