{% extends "base.html" %}
{% block title %}RAIDsystem — Set password{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Set your password</h2>
    <p class="auth-hint">Create a password for your RAIDsystem account. Use at least 8 characters.</p>
    <form method="post" class="auth-form">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required autofocus>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

        <button type="submit" class="auth-submit">Set password</button>
    </form>
</div>
{% endblock %}
