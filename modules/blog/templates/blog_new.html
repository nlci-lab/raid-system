{% extends "base.html" %}
{% block title %}RAIDsystem — New Post{% endblock %}
{% block breadcrumb %}<a href="/">Home</a> / <a href="{{ url_for('blog.index') }}">Blog</a> / New{% endblock %}
{% block content %}
<h2>New Post</h2>
<form class="blog-form" method="post" enctype="multipart/form-data">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ title }}" required>

    <label for="body">Body</label>
    <div class="format-toolbar" data-target="body">
        <button type="button" data-wrap="**">Bold</button>
        <button type="button" data-wrap="*">Italic</button>
        <button type="button" data-wrap="`">Code</button>
        <button type="button" data-prefix-line="### ">Heading</button>
        <button type="button" data-prefix-line="- ">List</button>
        <button type="button" data-wrap="[|](https://)">Link</button>
    </div>
    <textarea id="body" name="body" rows="12" required>{{ body }}</textarea>
    <p class="format-hint">Supports **bold**, *italic*, `code`, # headings, - lists, [text](url) links.</p>

    <label class="blog-checkbox-label">
        <input type="checkbox" name="is_internal" value="1" {% if is_internal %}checked{% endif %}>
        Internal Talk — requires login to view
    </label>

    <label for="files">Attachments</label>
    <input type="file" id="files" name="files" multiple>

    <button type="submit">Publish</button>
</form>
{% endblock %}
